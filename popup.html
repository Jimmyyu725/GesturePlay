<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --accent: linear-gradient(135deg, #7c3aed, #2563eb);
      }
      body {
        width: 300px;
        margin: 0;
        padding: 14px 16px 16px;
        font: 13px/1.5 system-ui, "Microsoft YaHei", sans-serif;
        color: #1d1d22;
        background: linear-gradient(135deg, #7c3aed10, #2563eb10);
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: var(--accent);
      }
      .gestures {
        font-size: 12px;
        color: #333;
        margin: 0 0 12px;
        line-height: 1.6;
      }
      .sec {
        font-size: 12px;
        font-weight: 700;
        color: #555;
        margin: 12px 0 6px;
        border-top: 1px solid #00000014;
        padding-top: 10px;
      }
      .row {
        margin: 9px 0;
      }
      .row .lab {
        display: flex;
        justify-content: space-between;
        margin-bottom: 3px;
      }
      .row .lab .val {
        font-family: ui-monospace, monospace;
        color: #2563eb;
        font-weight: 700;
      }
      input[type="range"] {
        width: 100%;
        accent-color: #7c3aed;
      }
      select#lang {
        width: 100%;
        padding: 5px;
        border-radius: 8px;
        border: 1px solid #00000022;
        background: #fff;
        font: inherit;
      }
      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 10px 0 2px;
      }
      .toggle input {
        width: 18px;
        height: 18px;
        accent-color: #7c3aed;
      }
      .hint {
        font-size: 11px;
        color: #777;
        margin-top: 2px;
      }
      button.reset {
        margin-top: 12px;
        width: 100%;
        padding: 7px;
        border: 0;
        border-radius: 8px;
        background: #00000010;
        color: #333;
        font-size: 12px;
        cursor: pointer;
      }
      button.reset:hover {
        background: #00000018;
      }
    </style>
  </head>
  <body>
    <h1><span class="dot"></span>GestureSeek</h1>

    <div class="gestures">
      <span data-i18n="summary1"></span><br />
      <span data-i18n="summary2"></span>
    </div>

    <div class="sec" data-i18n="secLanguage">Language</div>
    <div class="row">
      <select id="lang">
        <option value="auto" data-i18n="langAuto">Auto (follow browser)</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="sec" data-i18n="secSensitivity">Sensitivity (applies live)</div>

    <div class="row">
      <div class="lab"><span data-i18n="labDeadzone"></span><span class="val" id="vDead">0.05</span></div>
      <input type="range" id="deadzone" min="0" max="0.15" step="0.01" />
      <div class="hint" data-i18n="hintDeadzone"></div>
    </div>

    <div class="row">
      <div class="lab"><span data-i18n="labHold"></span><span class="val" id="vHold">0.35</span></div>
      <input type="range" id="hold" min="0.1" max="1.0" step="0.05" />
      <div class="hint" data-i18n="hintHold"></div>
    </div>

    <div class="row">
      <div class="lab"><span data-i18n="labFingers"></span><span class="val" id="vFingers">3</span></div>
      <input type="range" id="fingers" min="1" max="3" step="1" />
      <div class="hint" data-i18n="hintFingers"></div>
    </div>

    <div class="row">
      <div class="lab"><span data-i18n="labPinch"></span><span class="val" id="vPinch">0.05</span></div>
      <input type="range" id="pinch" min="0.03" max="0.1" step="0.005" />
      <div class="hint" data-i18n="hintPinch"></div>
    </div>

    <div class="sec" data-i18n="secDebug">Debug</div>
    <div class="toggle">
      <span data-i18n="labPreview"></span>
      <input type="checkbox" id="preview" />
    </div>
    <div class="hint" data-i18n="hintPreview"></div>

    <button class="reset" id="reset" data-i18n="reset">Reset to defaults</button>

    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
