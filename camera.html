<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GesturePlay camera</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      /* The raw webcam feed stays live but invisible; the preview is drawn to the
         canvas (only when the user enables it). */
      #cam {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0.01;
        pointer-events: none;
      }
      #preview {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="preview" width="240" height="180"></canvas>
    <script type="module" src="camera.js"></script>
  </body>
</html>
